services:
  postgres:
    image: postgres:15
    container_name: smartexamprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartexamprep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartexamprep"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartexamprep-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/smartexamprep
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-random-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
